<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clover Hill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D field; a quiet title top-left and one control dock along the bottom edge. Single deliberate look over the scene. */
:root{
  --ink:#f7f0e2;
  --ink-dim:rgba(247,240,226,.74);
  --glass:rgba(34,29,20,.48);
  --glass-line:rgba(247,240,226,.16);
  --accent:#f2c46d;
  --ground:#1d1b16;
  --pill-ink:#2a2418;
  --heart:#ff9a8f;
  --display:'Gloock', 'Iowan Old Style', Georgia, serif;
  --ui:'Figtree', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--ground);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#scene:active{cursor:grabbing}
.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:max(18px,calc(env(safe-area-inset-left,0px) + 18px));pointer-events:none;text-shadow:0 1px 14px rgba(20,14,6,.45)}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.2vw,44px);line-height:1;margin:0;letter-spacing:.005em;text-wrap:balance}
.brand p{margin:8px 0 0;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.dock{position:fixed;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;pointer-events:none}
.dock > *{pointer-events:auto}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.dock button{font:500 13px/1 var(--ui);color:var(--ink-dim);background:transparent;border:0;padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.dock button:hover{color:var(--ink)}
.dock button[aria-pressed="true"]{background:var(--ink);color:var(--pill-ink)}
.dock button:focus-visible,#label:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#auto{background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:12px 15px;display:flex;align-items:center;gap:8px}
#auto .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5}
#auto[aria-pressed="true"]{background:var(--ink);color:var(--pill-ink)}
#auto[aria-pressed="true"] .dot{opacity:1;background:#5f8a35}
.keys{margin:0;font-size:12px;color:var(--ink-dim);text-shadow:0 1px 10px rgba(20,14,6,.6);max-width:46ch;line-height:1.5;pointer-events:none}
.keys kbd{font:600 11px var(--ui);border:1px solid var(--glass-line);background:var(--glass);border-radius:5px;padding:1px 5px;color:var(--ink)}
#label{position:fixed;left:0;top:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:9px 13px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);font-family:var(--ui);cursor:pointer;text-align:left;margin-top:-10px;will-change:transform}
#label strong{font-family:var(--display);font-weight:400;font-size:19px;line-height:1}
#label span{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim)}
#label em{font-style:normal;font-size:12px;color:var(--accent)}
.heart{position:fixed;left:0;top:0;color:var(--heart);font-size:24px;pointer-events:none;animation:rise 1.5s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.25)}
@keyframes rise{from{opacity:1;translate:0 0;scale:.6}to{opacity:0;translate:0 -70px;scale:1.25}}
#label[hidden],#joy[hidden]{display:none}
#joy{position:fixed;left:0;top:0;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:1.5px solid var(--glass-line);background:rgba(34,29,20,.25);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--ink);opacity:.85}
@media (max-width:640px){.keys{display:none}.dock button{padding:9px 10px;font-size:12.5px}}
@media (prefers-reduced-motion:reduce){.heart{animation-duration:.01s}}
</style>
</head>
<body>

<canvas id="scene" tabindex="0" aria-label="A farmer walking through a pasture with cows, sheep, horses, pigs and chickens"></canvas>

<header class="brand">
  <h1>Clover Hill</h1>
  <p id="clock">Golden hour · Sun 9° above the horizon</p>
</header>

<div class="dock">
  <div class="controls">
    <div class="seg" role="group" aria-label="Time of day">
      <button type="button" id="t-morning" data-p="morning" aria-pressed="false">Morning</button>
      <button type="button" id="t-midday" data-p="midday" aria-pressed="false">Midday</button>
      <button type="button" id="t-golden" data-p="golden" aria-pressed="true">Golden hour</button>
      <button type="button" id="t-dusk" data-p="dusk" aria-pressed="false">Dusk</button>
    </div>
    <button type="button" id="auto" aria-pressed="true"><i class="dot"></i>Auto-stroll</button>
  </div>
  <p class="keys" id="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>Shift</kbd> run · drag to look around · scroll to zoom · <kbd>E</kbd> say hello to an animal</p>
</div>

<button type="button" id="label" hidden><span id="lkind"></span><strong id="lname"></strong><em id="lhint">Press E to say hello</em></button>
<div id="joy" hidden><div id="knob"></div></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------------- utilities ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

const isTouch=matchMedia('(pointer: coarse)').matches;
const small=Math.min(innerWidth,innerHeight)<700;

/* ---------------- world shape ---------------- */
const POND={x:30,z:-38}, BARN={x:-38,z:34}, PIG={x:-27,z:47}, SILO={x:-43,z:24};
function pathX(z){return 10*Math.sin(z*0.028)+4*Math.sin(z*0.071+1.0)-6;}
function baseH(x,z){
  let h=3.2*Math.sin(x*0.018)*Math.cos(z*0.022)+1.6*Math.sin(x*0.043+1.3)*Math.sin(z*0.037+0.7)+0.55*Math.sin(x*0.11+z*0.083)+0.25*Math.sin(x*0.31-z*0.27);

}

  h=lerp(h,PONDBASE,1-ss(12,34,d));
  h-=3.0*(1-ss(3,18,d));
  const db=Math.hypot(x-BARN.x,z-BARN.z);

}
const WATER=PONDBASE-1.3;
const fx=n=>n.toFixed(5);
const GLSL_TERRAIN=`
float pathX(float z){return 10.0*sin(z*0.028)+4.0*sin(z*0.071+1.0)-6.0;}
float baseH(vec2 p){float x=p.x,z=p.y;float h=3.2*sin(x*0.018)*cos(z*0.022)+1.6*sin(x*0.043+1.3)*sin(z*0.037+0.7)+0.55*sin(x*0.11+z*0.083)+0.25*sin(x*0.31-z*0.27);float r=length(p);h+=max(0.0,r-120.0)*0.07*(0.6+0.4*sin(atan(z,x+1e-5)*3.0));return h;}
float terrainH(vec2 p){float h=baseH(p);float d=length(p-vec2(${fx(POND.x)},${fx(POND.z)}));h=mix(h,${fx(PONDBASE)},1.0-smoothstep(12.0,34.0,d));h-=3.0*(1.0-smoothstep(3.0,18.0,d));float db=length(p-vec2(${fx(BARN.x)},${fx(BARN.z)}));h=mix(h,${fx(BARNBASE)},1.0-smoothstep(10.0,24.0,db));return h;}
`;
function inBarn(x,z,m){return Math.abs(x-BARN.x)<7.2+m&&Math.abs(z-BARN.z)<5.2+m;}
function onSpur(x,z,w){return Math.abs(z-BARN.z)<w&&x>-32&&x<pathX(z);}

/* ---------------- renderer, scene, camera ---------------- */
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,small?1.5:1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xf1c38c,0.0046);
const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,4000);

const hemi=new THREE.HemisphereLight(0xffffff,0x445522,1.1);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2.8);
sun.castShadow=true;
const SH=small?1024:2048;sun.shadow.mapSize.set(SH,SH);
Object.assign(sun.shadow.camera,{left:-42,right:42,top:42,bottom:-42,near:1,far:420});
sun.shadow.camera.updateProjectionMatrix();sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.05;
scene.add(sun);scene.add(sun.target);
const sunDir=new THREE.Vector3(0,1,0);

function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t;}
function spotTex(base,spot,n){return canvasTex(128,128,(x)=>{x.fillStyle=base;x.fillRect(0,0,128,128);x.fillStyle=spot;for(let i=0;i<n;i++){const cx=rand()*128,cy=rand()*128,r=10+rand()*24;x.beginPath();for(let k=0;k<=16;k++){const a=k/16*Math.PI*2,rr=r*(0.7+0.45*rand());x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*0.8);}x.fill();}});}
function plaidTex(){return canvasTex(64,64,(x)=>{x.fillStyle='#a8352b';x.fillRect(0,0,64,64);x.fillStyle='rgba(28,10,10,.45)';x.fillRect(0,0,64,12);x.fillRect(0,32,64,12);x.fillRect(0,0,12,64);x.fillRect(32,0,12,64);x.fillStyle='rgba(255,226,196,.32)';x.fillRect(0,22,64,2);x.fillRect(0,54,64,2);x.fillRect(22,0,2,64);x.fillRect(54,0,2,64);});}

/* ---------------- sky ---------------- */
const skyU={uZenith:{value:new THREE.Color()},uHorizon:{value:new THREE.Color()},uSunDir:{value:new THREE.Vector3(0,1,0)},uSunCol:{value:new THREE.Color()}};
const skyMat=new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,toneMapped:false,
  vertexShader:`varying vec3 vDir;void main(){vec4 wp=modelMatrix*vec4(position,1.0);vDir=wp.xyz-cameraPosition;gl_Position=projectionMatrix*viewMatrix*wp;gl_Position.z=gl_Position.w;}`,
  fragmentShader:`uniform vec3 uZenith,uHorizon,uSunDir,uSunCol;varying vec3 vDir;
  void main(){vec3 d=normalize(vDir);float y=d.y;vec3 col=mix(uHorizon,uZenith,pow(clamp(y,0.0,1.0),0.5));
  float s=max(dot(d,uSunDir),0.0);float hz=1.0-clamp(abs(y)*3.0,0.0,1.0);
  col+=uSunCol*(pow(s,5.0)*0.22*(0.4+0.6*hz)+pow(s,48.0)*0.32);
  col=mix(col,vec3(1.0,0.98,0.92),smoothstep(0.99935,0.9997,s));
  gl_FragColor=vec4(col,1.0);}`});
const sky=new THREE.Mesh(new THREE.SphereGeometry(3000,32,16),skyMat);sky.frustumCulled=false;sky.renderOrder=-10;scene.add(sky);
const envScene=new THREE.Scene();envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),skyMat));
const pmrem=new THREE.PMREMGenerator(renderer);let envRT=null;

/* distant ridges */
function makeRidge(radius,base,amp,seed){
  const N=360,pos=new Float32Array((N+1)*6),col=new Float32Array((N+1)*6),idx=[];
  for(let i=0;i<=N;i++){const a=i/N*Math.PI*2;
    const n=0.5+0.5*(0.5*Math.sin(a*3+seed)+0.3*Math.sin(a*7+seed*2.1)+0.2*(1-2*Math.abs(Math.sin(a*13+seed*3.3))));
    const top=base+amp*n,cx=Math.cos(a)*radius,cz=Math.sin(a)*radius;
    pos.set([cx,-30,cz,cx,top,cz],i*6);
    if(i<N){const b=i*2;idx.push(b,b+1,b+2,b+1,b+3,b+2);}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setIndex(idx);
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,fog:false,toneMapped:false,side:THREE.DoubleSide}));m.frustumCulled=false;scene.add(m);return m;
}
const ridgeFar=makeRidge(980,40,150,1.7), ridgeNear=makeRidge(760,10,85,4.2);
function colorRidge(m,bottom,top){const c=m.geometry.attributes.color;for(let i=0;i<c.count;i+=2){c.setXYZ(i,bottom.r,bottom.g,bottom.b);c.setXYZ(i+1,top.r,top.g,top.b);}c.needsUpdate=true;}

/* clouds */
const cloudMat=new THREE.MeshLambertMaterial({color:'#ffffff',flatShading:true,fog:false,emissive:'#000000'});
const clouds=[];
for(let i=0;i<18;i++){const parts=[];const n=5+Math.floor(rand()*4);
  for(let k=0;k<n;k++){const r=R(9,20);parts.push(prep(new THREE.IcosahedronGeometry(r,1),'#ffffff',{jit:0.3,seed:i*10+k,t:[(k-n/2)*R(9,13),R(0,6),R(-7,7)]}));}

/* ---------------- terrain ---------------- */
{
  const TS=1000,TN=small?240:320;
  const tg=new THREE.PlaneGeometry(TS,TS,TN,TN);tg.rotateX(-Math.PI/2);
  const tp=tg.attributes.position,tcol=new Float32Array(tp.count*3);
  const cA=new THREE.Color('#46702a'),cB=new THREE.Color('#759538'),cDry=new THREE.Color('#939b46'),cDirt=new THREE.Color('#8b6d4a'),cDirt2=new THREE.Color('#a68a5f'),cMud=new THREE.Color('#5a4630'),cDeep=new THREE.Color('#2f3527');
  const t=new THREE.Color(),t2=new THREE.Color();
  for(let i=0;i<tp.count;i++){
    const x=tp.getX(i),z=tp.getZ(i),h=terrainH(x,z);tp.setY(i,h);
    const n=0.5+0.5*Math.sin(x*0.061+Math.sin(z*0.047)*2.1)*Math.cos(z*0.053+Math.sin(x*0.039)*1.7);
    const n2=0.5+0.5*Math.sin(x*0.21+z*0.17)*Math.sin(z*0.19-x*0.07);
    t.copy(cA).lerp(cB,n).lerp(cDry,ss(0.55,1,n2)*0.45);
    const pd=Math.abs(x-pathX(z));let pm=1-ss(0.7,1.9,pd);
    if(onSpur(x,z,2.2))pm=Math.max(pm,1-ss(0.6,1.6,Math.abs(z-BARN.z)));
    if(Math.hypot(x-(BARN.x+9),z-BARN.z)<5)pm=Math.max(pm,(1-ss(2.5,5,Math.hypot(x-(BARN.x+9),z-BARN.z)))*0.85);
    if(pm>0){t2.copy(cDirt).lerp(cDirt2,n2);t.lerp(t2,pm);}
    t.lerp(cMud,1-ss(WATER+0.05,WATER+0.7,h));
    t.lerp(cDeep,1-ss(WATER-1.2,WATER-0.2,h));
    t.lerp(cMud,1-ss(3.5,6.2,Math.hypot(x-PIG.x,z-PIG.z)));
    tcol[i*3]=t.r;tcol[i*3+1]=t.g;tcol[i*3+2]=t.b;
  }
  tg.setAttribute('color',new THREE.BufferAttribute(tcol,3));tg.computeVertexNormals();
  const terrain=new THREE.Mesh(tg,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.97,metalness:0}));
  terrain.receiveShadow=true;scene.add(terrain);
}

/* ---------------- grass (GPU, wraps around the walker) ---------------- */
const GR=small?26:36, GN=small?30000:78000;
const GU={uTime:{value:0},uPlayer:{value:new THREE.Vector2()},uRadius:{value:GR},uWater:{value:WATER},uWidth:{value:0.095},
  uBase:{value:new THREE.Color('#2a4315')},uTip:{value:new THREE.Color('#8fb048')},uTip2:{value:new THREE.Color('#c0ba5e')},
  uSunDir:{value:new THREE.Vector3()},uSunCol:{value:new THREE.Color()}};
{
  const seg=4,pos=[],idx=[];
  for(let i=0;i<seg;i++){const y=i/seg,w=0.5*(1-y*0.85);pos.push(-w,y,0,w,y,0);}
  pos.push(0,1,0);
  for(let i=0;i<seg-1;i++){const a=i*2;idx.push(a,a+1,a+3,a,a+3,a+2);}
  const l=(seg-1)*2;idx.push(l,l+1,seg*2);
  const g=new THREE.InstancedBufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(new Array(pos.length).fill(0).map((v,i)=>i%3===2?1:0),3));
  g.setIndex(idx);
  const off=new Float32Array(GN*2),rnd=new Float32Array(GN*4);
  for(let i=0;i<GN;i++){off[i*2]=R(-GR,GR);off[i*2+1]=R(-GR,GR);
    rnd[i*4]=rand()<0.06?R(0.95,1.3):R(0.32,0.85);rnd[i*4+1]=rand()*Math.PI*2;rnd[i*4+2]=rand();rnd[i*4+3]=rand();}
  g.setAttribute('aOffset',new THREE.InstancedBufferAttribute(off,2));
  g.setAttribute('aRand',new THREE.InstancedBufferAttribute(rnd,4));
  g.instanceCount=GN;
  const mat=new THREE.MeshLambertMaterial({color:'#ffffff',side:THREE.DoubleSide});
  mat.onBeforeCompile=(sh)=>{

  midday:{label:'Midday',elev:56,az:2.8,zenith:'#4c86cf',horizon:'#cde0ec',sun:'#fff8ec',sunI:3.0,hemiSky:'#d4e6f7',hemiGround:'#5a6a36',hemiI:1.35,fog:0.0036,ridgeNear:'#5b7a6b',ridgeFar:'#88a1b2',exposure:0.95,glow:0},
  golden:{label:'Golden hour',elev:9,az:3.35,zenith:'#6d8cbc',horizon:'#f1c38c',sun:'#ffc67e',sunI:2.9,hemiSky:'#f0cfa2',hemiGround:'#58552c',hemiI:1.1,fog:0.0046,ridgeNear:'#7c7266',ridgeFar:'#b0948a',exposure:1.0,glow:0.15},
  dusk:{label:'Dusk',elev:2.5,az:3.7,zenith:'#283862',horizon:'#e2875d',sun:'#ff8c4e',sunI:1.2,hemiSky:'#8c86a6',hemiGround:'#2e3222',hemiI:0.75,fog:0.0052,ridgeNear:'#3e3a4a',ridgeFar:'#6a5168',exposure:1.15,glow:1}
};
const NUM=['elev','az','sunI','hemiI','fog','exposure','glow'],COL=['zenith','horizon','sun','hemiSky','hemiGround','ridgeNear','ridgeFar'];
const toState=p=>{const s={};NUM.forEach(k=>s[k]=p[k]);COL.forEach(k=>s[k]=new THREE.Color(p[k]));return s;};
const cur=toState(PRESETS.golden);let from=toState(PRESETS.golden),to=toState(PRESETS.golden),envT=1,envDirty=true;
function setPreset(name){
  from={};NUM.forEach(k=>from[k]=cur[k]);COL.forEach(k=>from[k]=cur[k].clone());to=toState(PRESETS[name]);envT=0;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p===name)));
  const p=PRESETS[name];document.getElementById('clock').textContent=`${p.label} · Sun ${p.elev}° above the horizon`;
  try{localStorage.setItem('cloverhill-time',name);}catch(e){}
}
function applyEnv(){
  const e=THREE.MathUtils.degToRad(cur.elev),a=cur.az;
  sunDir.set(Math.cos(e)*Math.sin(a),Math.sin(e),Math.cos(e)*Math.cos(a));
  sun.color.copy(cur.sun);sun.intensity=cur.sunI;
  hemi.color.copy(cur.hemiSky);hemi.groundColor.copy(cur.hemiGround);hemi.intensity=cur.hemiI;
  scene.fog.color.copy(cur.horizon);scene.fog.density=cur.fog;
  cur.zenith.getRGB(skyU.uZenith.value,THREE.SRGBColorSpace);cur.horizon.getRGB(skyU.uHorizon.value,THREE.SRGBColorSpace);cur.sun.getRGB(skyU.uSunCol.value,THREE.SRGBColorSpace);
  skyU.uSunDir.value.copy(sunDir);
  GU.uSunDir.value.copy(sunDir);GU.uSunCol.value.copy(cur.sun).multiplyScalar(cur.sunI);
  renderer.toneMappingExposure=cur.exposure;
  colorRidge(ridgeNear,cur.horizon,cur.ridgeNear);colorRidge(ridgeFar,cur.horizon,cur.ridgeFar);
  cloudMat.emissive.copy(cur.horizon).multiplyScalar(0.42);
  windowMat.emissiveIntensity=cur.glow*2.4;
  ffMat.opacity=clamp((cur.glow-0.4)/0.6,0,1);
}
function refreshEnvMap(){const old=envRT;envRT=pmrem.fromScene(envScene,0,0.1,200);waterMat.envMap=envRT.texture;waterMat.needsUpdate=true;if(old)old.dispose();}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setPreset(b.dataset.p)));
let savedT=null;try{savedT=localStorage.getItem('cloverhill-time');}catch(e){}
if(savedT&&PRESETS[savedT]&&savedT!=='golden'){setPreset(savedT);envT=0.999;}

/* ---------------- input ---------------- */
const keys={};let auto=true,run=false;
const autoBtn=document.getElementById('auto');
function setAuto(v){auto=v;autoBtn.setAttribute('aria-pressed',String(v));}
autoBtn.addEventListener('click',()=>setAuto(!auto));
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(e.target.closest&&e.target.closest('button')&&(k===' '||k==='enter'))return;keys[k]=true;if(k==='shift')run=true;if(k==='e'&&near)pet(near);if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;if(k==='shift')run=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;run=false;});
let camYaw=0.4,camPitch=0.24,camDist=7.5,lastLook=-99;
const joy={id:null,ox:0,oy:0,x:0,y:0},orbit={id:null,lx:0,ly:0};
const joyEl=document.getElementById('joy'),knob=document.getElementById('knob');
canvas.addEventListener('pointerdown',e=>{
  canvas.focus();
  if(e.pointerType==='touch'&&e.clientX<innerWidth*0.45&&joy.id===null){joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.x=joy.y=0;joyEl.hidden=false;joyEl.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;knob.style.transform='';}
  else if(orbit.id===null){orbit.id=e.pointerId;orbit.lx=e.clientX;orbit.ly=e.clientY;}
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerId===joy.id){let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const l=Math.hypot(dx,dy),m=48;if(l>m){dx*=m/l;dy*=m/l;}joy.x=dx/m;joy.y=-dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`;}
  else if(e.pointerId===orbit.id){camYaw-=(e.clientX-orbit.lx)*0.006;camPitch=clamp(camPitch+(e.clientY-orbit.ly)*0.004,0.04,1.2);orbit.lx=e.clientX;orbit.ly=e.clientY;lastLook=T;}
});
const endP=e=>{if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;joyEl.hidden=true;}if(e.pointerId===orbit.id)orbit.id=null;};
canvas.addEventListener('pointerup',endP);canvas.addEventListener('pointercancel',endP);
canvas.addEventListener('wheel',e=>{e.preventDefault();camDist=clamp(camDist*(1+Math.sign(e.deltaY)*0.08),3.2,18);},{passive:false});
if(isTouch){document.getElementById('lhint').textContent='Tap to say hello';}

/* ---------------- sounds (only after you greet an animal) ---------------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC.state==='suspended')AC.resume();return AC;}
function voice(kind){
  const a=ac();if(!a)return;const t0=a.currentTime;const out=a.createGain();out.connect(a.destination);out.gain.value=0;
  const env=(g,t,peak,dur,att)=>{g.setValueAtTime(0,t);g.linearRampToValueAtTime(peak,t+att);g.setValueAtTime(peak,t+dur*0.6);g.linearRampToValueAtTime(0,t+dur);};
  const osc=(type,f)=>{const o=a.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t0);return o;};
  const vib=(o,rate,depth,t,dur)=>{const l=a.createOscillator(),lg=a.createGain();l.frequency.value=rate;lg.gain.value=depth;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur);};
  if(kind==='cow'){const f=a.createBiquadFilter();f.type='lowpass';f.Q.value=5;f.frequency.setValueAtTime(300,t0);f.frequency.linearRampToValueAtTime(950,t0+0.35);f.frequency.linearRampToValueAtTime(330,t0+1.5);f.connect(out);
    [1,1.007].forEach(m=>{const o=osc('sawtooth',118*m);o.frequency.linearRampToValueAtTime(134*m,t0+0.3);o.frequency.exponentialRampToValueAtTime(86*m,t0+1.5);o.connect(f);o.start(t0);o.stop(t0+1.7);});env(out.gain,t0,0.2,1.55,0.22);}
  else if(kind==='sheep'){const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=1.4;f.frequency.value=1300;f.connect(out);const o=osc('sawtooth',310);o.frequency.linearRampToValueAtTime(290,t0+0.9);vib(o,6.5,22,t0,1);o.connect(f);o.start(t0);o.stop(t0+1);env(out.gain,t0,0.28,0.95,0.06);}
  else if(kind==='horse'){const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.value=1500;f.connect(out);const o=osc('sawtooth',650);o.frequency.linearRampToValueAtTime(1100,t0+0.25);o.frequency.linearRampToValueAtTime(420,t0+1.15);vib(o,11,45,t0,1.2);o.connect(f);o.start(t0);o.stop(t0+1.2);env(out.gain,t0,0.22,1.15,0.05);}
  else if(kind==='pig'){const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=3;f.frequency.value=480;f.connect(out);[0,0.26].forEach(d=>{const o=a.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(170,t0+d);o.frequency.linearRampToValueAtTime(115,t0+d+0.18);o.connect(f);o.start(t0+d);o.stop(t0+d+0.2);});
    out.gain.setValueAtTime(0,t0);[0,0.26].forEach(d=>{out.gain.linearRampToValueAtTime(0.5,t0+d+0.03);out.gain.linearRampToValueAtTime(0,t0+d+0.19);});}
  else{const f=a.createBiquadFilter();f.type='bandpass';f.Q.value=2;f.frequency.value=1600;f.connect(out);out.gain.setValueAtTime(0,t0);[0,0.13,0.24,0.42].forEach((d,i)=>{const o=a.createOscillator();o.type='square';o.frequency.setValueAtTime(i===3?900:620,t0+d);o.frequency.linearRampToValueAtTime(i===3?1150:760,t0+d+0.07);o.connect(f);o.start(t0+d);o.stop(t0+d+(i===3?0.16:0.07));out.gain.linearRampToValueAtTime(0.14,t0+d+0.01);out.gain.linearRampToValueAtTime(0,t0+d+(i===3?0.16:0.07));});}
}

/* ---------------- greeting label ---------------- */
const label=document.getElementById('label'),lname=document.getElementById('lname'),lkind=document.getElementById('lkind');
let near=null,shown=null;const pv=new THREE.Vector3();
function pet(a){a.state='attend';a.timer=4;a.flee=false;voice(a.kind);
  const h=document.createElement('span');h.className='heart';h.textContent='♥';h.setAttribute('aria-hidden','true');
  pv.set(a.x,a.g.position.y+a.sp.labelY*a.sc,a.z).project(camera);h.style.transform=`translate(${(pv.x*0.5+0.5)*innerWidth-10}px,${(-pv.y*0.5+0.5)*innerHeight-40}px)`;document.body.appendChild(h);setTimeout(()=>h.remove(),1600);}
label.addEventListener('click',()=>{if(near)pet(near);});
function updateLabel(){
  let best=null,bd=4.5;for(const a of animals){const d=Math.hypot(a.x-P.x,a.z-P.z);if(d<bd){bd=d;best=a;}}
  near=best;
  if(!best){if(shown){label.hidden=true;shown=null;}return;}
  pv.set(best.x,best.g.position.y+best.sp.labelY*best.sc,best.z).project(camera);
  if(pv.z>1||Math.abs(pv.x)>1.1||Math.abs(pv.y)>1.1){label.hidden=true;shown=null;return;}
  if(shown!==best){lname.textContent=best.name;lkind.textContent=best.desc;shown=best;label.hidden=false;}
  label.style.transform=`translate(${Math.round((pv.x*0.5+0.5)*innerWidth)}px,${Math.round((-pv.y*0.5+0.5)*innerHeight)}px) translate(-50%,-100%)`;
}

/* ---------------- frame loop ---------------- */
function blocked(x,z){return terrainH(x,z)<WATER-0.15||inBarn(x,z,0.35)||Math.hypot(x-SILO.x,z-SILO.z)<2.7||Math.hypot(x,z)>235;}
let autoDir=-1;
const camPos=new THREE.Vector3(),camTgt=new THREE.Vector3(),camWant=new THREE.Vector3();
function updateWalker(dt){
  let fwd=(keys['w']||keys['arrowup']?1:0)-(keys['s']||keys['arrowdown']?1:0)+joy.y;
  let rgt=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0)+joy.x;
  let mag=Math.min(1,Math.hypot(fwd,rgt)),dx=0,dz=0,want=0;
  if(mag>0.12){if(auto)setAuto(false);
    const fx_=-Math.sin(camYaw),fz=-Math.cos(camYaw);dx=fx_*fwd+(-fz)*rgt;dz=fz*fwd+fx_*rgt;const l=Math.hypot(dx,dz);dx/=l;dz/=l;want=(run?4.4:1.7)*mag;}
  else if(auto){if(P.z<-150)autoDir=1;if(P.z>110)autoDir=-1;const tz=P.z+autoDir*4,tx=pathX(tz);dx=tx-P.x;dz=tz-P.z;const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;want=1.35;}
  if(want>0){const tH=Math.atan2(dx,dz);P.h+=clamp(wrapA(tH-P.h),-6*dt,6*dt);}
  P.speed+=(want-P.speed)*Math.min(1,dt*(want>P.speed?4:6));
  if(want>0){const nx=P.x+dx*P.speed*dt,nz=P.z+dz*P.speed*dt;if(!blocked(nx,P.z))P.x=nx;if(!blocked(P.x,nz))P.z=nz;}
  for(const t of treeCol){const ddx=P.x-t.x,ddz=P.z-t.z,m=t.r+0.3,d2=ddx*ddx+ddz*ddz;if(d2<m*m){const d=Math.sqrt(d2)||0.01;P.x=t.x+ddx/d*m;P.z=t.z+ddz/d*m;}}
  const y=terrainH(P.x,P.z);walker.g.position.set(P.x,y,P.z);walker.g.rotation.y=P.h;
  P.phase+=P.speed*dt*4.4;
  const amp=Math.min(1,P.speed/1.5)*(P.speed>3?0.85:0.55),s=Math.sin(P.phase)*amp;
  walker.legs[0].rotation.x=s;walker.legs[1].rotation.x=-s;walker.arms[0].rotation.x=-s*0.8;walker.arms[1].rotation.x=s*0.8;
  walker.rig.position.y=Math.abs(Math.cos(P.phase))*0.045*Math.min(1,P.speed/1.2)+Math.sin(T*1.6)*0.006;
  walker.rig.rotation.x=P.speed>3?0.12:0.02;
  walker.head.rotation.y=near&&P.speed<0.5?clamp(wrapA(Math.atan2(near.x-P.x,near.z-P.z)-P.h),-0.9,0.9):Math.sin(T*0.35)*0.25*(P.speed<0.3?1:0.3);
}
function updateCamera(dt){
  if(auto&&T-lastLook>4){const want=P.h+Math.PI+0.5*Math.sin(T*0.06);camYaw+=wrapA(want-camYaw)*(1-Math.exp(-dt*0.6));}
  camTgt.set(P.x,terrainH(P.x,P.z)+1.45,P.z);
  const cp=Math.cos(camPitch);
  camWant.set(camTgt.x+Math.sin(camYaw)*cp*camDist,camTgt.y+Math.sin(camPitch)*camDist,camTgt.z+Math.cos(camYaw)*cp*camDist);
  const gh=terrainH(camWant.x,camWant.z)+0.6;if(camWant.y<gh)camWant.y=gh;
  camPos.lerp(camWant,1-Math.exp(-dt*7));camera.position.copy(camPos);camera.lookAt(camTgt);
}
const clock=new THREE.Clock();
camPos.set(P.x+Math.sin(camYaw)*camDist,terrainH(P.x,P.z)+3,P.z+Math.cos(camYaw)*camDist);
applyEnv();refreshEnvMap();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05);T+=dt;
  if(envT<1){envT=Math.min(1,envT+dt/2.2);const k=ss(0,1,envT);NUM.forEach(n=>cur[n]=lerp(from[n],to[n],k));COL.forEach(n=>cur[n].copy(from[n]).lerp(to[n],k));applyEnv();if(envT>=1)envDirty=true;}
  if(envDirty){refreshEnvMap();envDirty=false;}
  updateWalker(dt);
  for(const a of animals)a.update(dt);
  updateCamera(dt);
  GU.uTime.value=T;GU.uPlayer.value.set(P.x,P.z);
  sky.position.copy(camera.position);
  sun.position.set(P.x+sunDir.x*160,terrainH(P.x,P.z)+sunDir.y*160,P.z+sunDir.z*160);sun.target.position.set(P.x,terrainH(P.x,P.z),P.z);
  for(const c of clouds){c.position.x+=c.userData.v*dt;if(c.position.x>900)c.position.x=-900;}
  for(const b of birds){b.a+=b.v*dt;const x=b.cx+Math.cos(b.a)*b.rad,z=b.cz+Math.sin(b.a)*b.rad;b.g.position.set(x,b.y+Math.sin(T*0.5+b.ph)*2,z);b.g.rotation.y=Math.atan2(-Math.sin(b.a)*Math.sign(b.v),Math.cos(b.a)*Math.sign(b.v));const f=Math.sin(T*7+b.ph)*0.55*(Math.sin(T*0.7+b.ph)>-0.3?1:0.15);b.r.rotation.z=f;b.l.rotation.z=-f;}
  const showFlies=cur.glow<0.6;
  for(const f of flies){f.g.visible=showFlies;if(!showFlies)continue;
    if(Math.hypot(f.ax-P.x,f.az-P.z)>24){const a=P.h+R(-1.3,1.3),d=R(5,16);f.ax=P.x+Math.sin(a)*d;f.az=P.z+Math.cos(a)*d;}
    const t=T+f.ph,x=f.ax+Math.sin(t*0.9)*1.4+Math.sin(t*2.3)*0.3,z=f.az+Math.cos(t*0.7)*1.4;
    f.g.position.set(x,terrainH(x,z)+0.55+0.35*Math.sin(t*1.7)+Math.abs(Math.sin(t*3))*0.15,z);
    const vx=x-f.px,vz=z-f.pz;if(vx*vx+vz*vz>1e-8)f.g.rotation.y=Math.atan2(vx,vz);f.px=x;f.pz=z;
    const w=Math.sin(t*24)*0.95;f.r.rotation.z=w;f.l.rotation.z=-w;}
  for(const d of ducks){d.a+=d.v*dt;d.g.position.set(POND.x+Math.cos(d.a)*d.r,WATER+Math.sin(T*2+d.r)*0.015,POND.z+Math.sin(d.a)*d.r);d.g.rotation.y=Math.atan2(-Math.sin(d.a)*Math.sign(d.v),Math.cos(d.a)*Math.sign(d.v));}
  if(ffMat.opacity>0.01){const S=44;for(let i=0;i<FFN;i++){const a=ffA[i];let rx=((a[0]-P.x)%S+S*1.5)%S-S/2,rz=((a[1]-P.z)%S+S*1.5)%S-S/2;const x=P.x+rx+Math.sin(T*0.4+a[3])*0.8,z=P.z+rz+Math.cos(T*0.33+a[3])*0.8;
      ffPos[i*3]=x;ffPos[i*3+1]=terrainH(x,z)+0.3+a[2]*1.6+Math.sin(T*0.7+a[3])*0.2;ffPos[i*3+2]=z;const b=Math.pow(Math.max(0,Math.sin(T*1.3+a[3]*3)),3);ffCol[i*3]=b;ffCol[i*3+1]=b*0.85;ffCol[i*3+2]=b*0.35;}
    ffGeo.attributes.position.needsUpdate=true;ffGeo.attributes.color.needsUpdate=true;}
  updateLabel();
  renderer.render(scene,camera);
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
